name: Nexar Admin Auto Deploy

on:
  push:
    branches:
      - deployment

jobs:
  deploy:
    name: Deploy Admin (API + Frontend)
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          debug: true
          script: |
            echo "🔄 Pulling latest admin code..."
            cd /var/www/nexar-admin
            git pull origin deployment

            echo "📦 Installing backend dependencies..."
            cd backend
            npm install

            echo "🚀 Restarting admin API with PM2..."
            pm2 restart nexar-admin-backend || pm2 start server.js --name nexar-admin-backend

            echo "📦 Installing frontend dependencies..."
            cd ../frontend
            npm install

            echo "⚙️ Building admin frontend..."
            npm run build

            echo "🔁 Reloading Nginx..."
            sudo systemctl reload nginx

            echo "✅ Admin deployment complete!"
